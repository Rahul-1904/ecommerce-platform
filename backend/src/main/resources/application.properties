spring.application.name=ecommerce-backend
server.port=8080

# --- Database ---
# Override any of these with a real environment variable in staging/production.
# Defaults below match the local dev setup so `mvn spring-boot:run` works out of the box.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# Dev-only default below. In staging/production, set JWT_SECRET to your own
# 256-bit+ secret (e.g. `openssl rand -base64 64`) — never reuse this one.
jwt.secret=${JWT_SECRET:c2VjdXJlLWVjb21tZXJjZS1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1wbGVhc2U=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
